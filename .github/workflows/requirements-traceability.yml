name: Requirements traceability

# PRC-01, PRC-02 (owner, 2026-11-13): the traceability files (docs/traceability/: matrix, one file per release with
# its build sequence, coverage) and the req-check report are generated, not committed. After every push to main
# this workflow generates them and publishes them so they can be read without a checkout:
# - the run summary shows the req-check report and the PoC build sequence;
# - the artifact `traceability` holds every file (README.md, matrix.md, release-*.md, coverage.md,
#   req-check-report.md and item-coverage.md, the --coverage output).
# Where to find it: Actions → «Requirements traceability» → the latest run on main → Summary / Artifacts.
# Read-only: no write permission, no secrets, no external services. About a minute per merge (CI minutes).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: requirements-traceability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout; the artifact upload uses the runner's own token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate the traceability files, the report and the item coverage
        run: |
          node tools/req-check/index.mjs --quiet --traceability --report docs/traceability/req-check-report.md
          node tools/req-check/index.mjs --quiet --coverage > docs/traceability/item-coverage.md
      - name: Report and PoC build sequence in the run summary
        if: ${{ !cancelled() }}
        run: |
          for f in docs/traceability/req-check-report.md docs/traceability/release-poc.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Publish the artifact `traceability`
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traceability
          path: docs/traceability/
          if-no-files-found: error
          retention-days: 90
