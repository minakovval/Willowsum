name: PR checks

# PR checks (CICD-02). More checks are added as the code grows. The `traceability` job (PR title and
# description, CICD-01 FR 2) is in pr-description.yml: it also runs when the description is edited.
#
# CI minutes (lead decision 2026-11-12; private repository, 2,000 free minutes a month):
# - a new push cancels the PR's run still in progress (concurrency, keyed by the PR);
# - the pnpm store is cached, keyed by the lockfile;
# - the `changes` job decides from the PR's changed paths (tools/pr-rules/lib/ci-paths.mjs) which heavy jobs
#   (web, api, local-env, infra) are needed; a job that is not needed is skipped by its `if` and its check
#   concludes `skipped`. The daily check of main accepts a skipped job only when the same function says the
#   merged PR did not need it. `requirements`, `secrets` and `changes` (and `traceability`) always run.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    # Which heavy jobs this PR needs, by its changed paths. On any error every job runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's changed files
    outputs:
      web: ${{ steps.paths.outputs.web }}
      api: ${{ steps.paths.outputs.api }}
      local_env: ${{ steps.paths.outputs.local-env }}
      infra: ${{ steps.paths.outputs.infra }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Heavy jobs needed by the changed paths
        id: paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/pr-rules/index.mjs changes

  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Requirements checker unit tests
        run: node --test tools/req-check
      # Structure, release/priority, self-containedness, acceptance criteria, the fact registry
      # (tools/req-check/facts.json) and release slices with their link headers. Known findings are in tools/req-check/baseline.json; new ones fail.
      - name: Check docs/requirements
        run: node tools/req-check/index.mjs --report "$RUNNER_TEMP/req-check-report.md"
      # Release slices and link headers (check 6) feed docs/traceability/ (PRC-01). Regenerate the release views
      # of the requirement sources (check 7: <ID>.<release>.md is generated from <ID>.md), the traceability files
      # and the committed report (all deterministic) and fail when the committed files differ (PRC-02).
      - name: Release views, traceability files and report are up to date
        run: |
          node tools/req-check/index.mjs --quiet --views --traceability --report docs/validation/req-check-report.md
          if [ -n "$(git status --porcelain -- docs/requirements docs/traceability docs/validation/req-check-report.md)" ]; then
            git status --porcelain -- docs/requirements docs/traceability docs/validation/req-check-report.md
            git --no-pager diff --stat -- docs/requirements docs/traceability docs/validation/req-check-report.md
            echo "::error::Release views, docs/traceability or docs/validation/req-check-report.md are out of date. Edit the source <ID>.md, not a view; run: node tools/req-check/index.mjs --views --traceability --report docs/validation/req-check-report.md and commit the result."
            exit 1
          fi
      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/req-check-report.md" ]; then cat "$RUNNER_TEMP/req-check-report.md" >> "$GITHUB_STEP_SUMMARY"; fi

  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    # Front-end packages: types, lint, formatting, unit tests and the static build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable pnpm (version from package.json via corepack)
        run: corepack enable
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store (keyed by the lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-node22-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  secrets:
    # CICD-12 FR 9: a secret in the PR's commits blocks the PR (gitleaks). The weekly full-history scan is
    # .github/workflows/secret-scan.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  local-env:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.local_env != 'false' }}
    # CICD-04: the local environment starts with one command and every service answers (smoke test).
    # CI uses the same compose file with freshly generated, throwaway credentials and synthetic data.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Local environment tool unit tests
        run: node --test tools/local-env
      - name: Start the local environment (one command)
        run: node tools/local-env/index.mjs up
      - name: Mask the generated throwaway secrets in later log output
        run: |
          grep -E '^WS_LOCAL_[A-Z0-9_]*(PASSWORD|SECRET_KEY)=' infra/local/.state/local.env | cut -d= -f2- | while read -r v; do
            echo "::add-mask::$v"
          done
      - name: Smoke test PostgreSQL, mail and S3 storage
        run: node tools/local-env/index.mjs smoke
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/local/compose.yaml --env-file infra/local/.state/local.env logs --no-color --tail 200
      - name: Stop the local environment
        if: always()
        run: node tools/local-env/index.mjs down

  api:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    # Backend (ARC-01): module boundaries, the API contract (ARC-07) and integration tests on a real PostgreSQL 17 (ARC-03).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same pinned image as the local environment (infra/local/compose.yaml).
        image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away CI database; not a secret.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable pnpm (version from package.json via corepack)
        run: corepack enable
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store (keyed by the lockfile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-node22-
      - run: pnpm install --frozen-lockfile
      - name: Module boundaries, dependency rules and event contracts (ARC-01)
        run: pnpm --filter @willowsum/api check:modules
      - name: API contract matches the routes; the typed client matches the contract (ARC-07)
        run: pnpm contract:check
      - name: Feature flags have an owner and a review date; none past it or fully enabled over 30 days (CICD-06)
        run: pnpm check:flags
      - name: Integration tests on PostgreSQL 17
        run: pnpm --filter @willowsum/api test:integration
      - name: Schema check — row policies, household column, amounts, UTC time, region (ARC-03)
        run: pnpm --filter @willowsum/api check:schema
      - name: Base version of the PR (for migration compatibility, ARC-03 FR 4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false
      - name: API contract changes only compatibly within /v1 against the base branch (ARC-07 FR 3)
        run: pnpm --filter @willowsum/api contract:compat "$GITHUB_WORKSPACE/.base/packages/api-contract/openapi.json"
      - name: Migrations expand → migrate → contract; released migrations unchanged (ARC-03 FR 4)
        env:
          WS_MIGRATION_BASE_DIR: ${{ github.workspace }}/.base
        run: pnpm --filter @willowsum/api check:migrations
      - name: Old code + new schema — the base version's module tests on this PR's migrations (ARC-03 FR 4)
        env:
          WS_COMPAT_SCHEMA_FROM: ${{ github.workspace }}/apps/api
        run: |
          if [ ! -f .base/apps/api/test/real-modules.ts ]; then
            echo "The base version has no compatibility harness yet (it arrives with ARC-03); nothing to run."
            exit 0
          fi
          cd .base
          pnpm install --frozen-lockfile
          pnpm --filter @willowsum/api exec vitest run --config vitest.integration.config.ts src/modules --passWithNoTests
      - name: One image, three roles (ARC-02); without configuration it refuses to start and names the variables
        run: |
          docker build -q -f apps/api/Dockerfile -t willowsum-api:ci .
          for role in api worker scheduler; do
            set +e
            out=$(docker run --rm willowsum-api:ci --role "$role" 2>&1)
            code=$?
            set -e
            echo "$role: $out"
            test "$code" = "1"
            # Names only: the list grows with every module (WS_DB_PASSWORD_<SCHEMA>), values never appear.
            echo "$out" | grep -Eq '^Configuration error: missing or invalid ([A-Z0-9_]+, )*WS_DB_HOST, ([A-Z0-9_]+, )*WS_DB_NAME(, [A-Z0-9_]+)*$'
          done

  infra:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.infra != 'false' }}
    # CICD-07: the «Старт» infrastructure code (infra/start) is formatted, valid for the pinned OpenTofu
    # and OCI provider, and keeps the static rules (tools/infra-check). No cloud access: nothing is
    # planned or applied here and no secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Static infrastructure rules
        run: node --test tools/infra-check
      # ARC-09 FR 4, NFR-10 FR 5–6: SLOs, alert rules, routing and the SLO dashboard are generated from
      # tools/observability/definitions.mjs; every required alert exists and pages within 5 minutes.
      - name: SLO and alert rules (ARC-09, NFR-10)
        run: |
          node --test tools/observability
          node tools/observability/index.mjs --check
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false
      - name: Formatting
        run: tofu fmt -check -recursive -diff infra/start
      - name: Init without backend and validate
        run: |
          # A throwaway passphrase so the enforced state encryption can be configured; nothing is stored.
          TF_VAR_state_passphrase="$(openssl rand -base64 33)"
          echo "::add-mask::$TF_VAR_state_passphrase"
          export TF_VAR_state_passphrase
          tofu -chdir=infra/start init -backend=false -input=false
          tofu -chdir=infra/start validate
