name: PR checks

# Minimal checks until the code skeleton exists (CICD-01, CICD-02 add the full pipeline).

on:
  pull_request:

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - name: PR title starts with a requirement ID
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(ACC|SUB|ADM|AST|VAL|FIN|INV|CRY|BUD|IMP|DAT|DOC|INS|NOT|RPT|SUP|UX|GRID|L10N|LEG|PLT|VLT|AI|INT|PLN|ADV|NFR|DS|CMP|FLW|JRN|SCR|ARC|CICD)-[0-9]{2}[a-z]?\b'; then
            echo "ok"
          else
            echo "::error::PR title must start with a requirement ID from docs/requirements/ (e.g. BUD-03: ...)"; exit 1
          fi

  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Requirements checker unit tests
        run: node --test tools/req-check
      # Structure, release/priority, self-containedness, acceptance criteria and the fact registry
      # (tools/req-check/facts.json). Known findings are in tools/req-check/baseline.json; new ones fail.
      - name: Check docs/requirements
        run: node tools/req-check/index.mjs --report "$RUNNER_TEMP/req-check-report.md"
      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/req-check-report.md" ]; then cat "$RUNNER_TEMP/req-check-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
