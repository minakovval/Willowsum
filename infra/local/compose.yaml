# Local environment (CICD-04@PoC, row «Локальне»): the backing services the app needs on a
# developer's or agent's machine — PostgreSQL, mail and S3-compatible file storage.
#
# Start it with one command from the repository root: `pnpm local:up` (tools/local-env).
# Do not run `docker compose` on this file directly: the tool first generates the local credentials
# into infra/local/.state/ (git-ignored), then passes them in.
#
# Rules this file keeps (checked by tools/local-env/test/compose.test.mjs):
# - only standard, cloud-neutral technology (ARC-08): PostgreSQL 17, SMTP, S3 API;
# - every image pinned to a version tag and a digest (CICD-03), licences from the allowed list (CICD-02):
#   PostgreSQL licence, Mailpit MIT, SeaweedFS Apache-2.0;
# - ports are published on 127.0.0.1 only;
# - no credentials in this file: they come from the generated env file (CICD-12);
# - synthetic data only (CICD-04): the volumes hold nothing but what local runs create.

name: willowsum-local

services:
  postgres:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: ${WS_LOCAL_PG_USER:?run pnpm local:up}
      POSTGRES_PASSWORD: ${WS_LOCAL_PG_PASSWORD:?run pnpm local:up}
      POSTGRES_DB: ${WS_LOCAL_PG_DB:?run pnpm local:up}
      # ARC-03: all times are UTC.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${WS_LOCAL_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mail:
    # Catches every message sent over SMTP; nothing leaves the machine. Web UI and API on the http port.
    image: axllent/mailpit:v1.28@sha256:c6cf0b06eb516a0b80a8a5251f945c131e6beb8396112964404f62856487f5bd
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_AUTH: ${WS_LOCAL_SMTP_USER:?run pnpm local:up}:${WS_LOCAL_SMTP_PASSWORD:?run pnpm local:up}
      # The web UI and API need a login too: caught mail will hold sign-in links and codes.
      MP_UI_AUTH: ${WS_LOCAL_MAIL_UI_USER:?run pnpm local:up}:${WS_LOCAL_MAIL_UI_PASSWORD:?run pnpm local:up}
      MP_MAX_MESSAGES: "5000"
      TZ: UTC
    ports:
      - "127.0.0.1:${WS_LOCAL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${WS_LOCAL_MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3:
    # S3-compatible object storage (single node: master, volume, filer and S3 gateway in one process).
    image: chrislusf/seaweedfs:4.01@sha256:d91cdf769018b143f1c944085b36d29893d9af199e656b2537367c35744fc221
    command:
      - server
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=256
      - -volume.max=0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/willowsum/s3.json
    ports:
      - "127.0.0.1:${WS_LOCAL_S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    configs:
      # Built from the generated variables; never written to the repository or the host's disk by the tool.
      - source: s3-identities
        target: /etc/willowsum/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

configs:
  s3-identities:
    content: |
      {
        "identities": [
          {
            "name": "willowsum-local",
            "credentials": [
              {
                "accessKey": "${WS_LOCAL_S3_ACCESS_KEY:?run pnpm local:up}",
                "secretKey": "${WS_LOCAL_S3_SECRET_KEY:?run pnpm local:up}"
              }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

volumes:
  postgres-data:
  s3-data:
