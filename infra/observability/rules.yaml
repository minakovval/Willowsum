# Generated by tools/observability (ARC-09, NFR-10, ADR-0006) — do not edit; change tools/observability/definitions.mjs
# and run: node tools/observability/index.mjs --write
# Rule groups for the Grafana Cloud (Mimir) ruler
groups:
  - name: "willowsum-slo-recording"
    interval: "1m"
    rules:
      - record: "ws:api_requests:rate5m"
        expr: "sum(rate(http_server_request_duration_seconds_count[5m]))"
      - record: "ws:api_error_ratio:rate5m"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))"
      - record: "ws:api_error_ratio:rate30m"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[30m])) / sum(rate(http_server_request_duration_seconds_count[30m]))"
      - record: "ws:api_error_ratio:rate1h"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[1h])) / sum(rate(http_server_request_duration_seconds_count[1h]))"
      - record: "ws:api_error_ratio:rate2h"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[2h])) / sum(rate(http_server_request_duration_seconds_count[2h]))"
      - record: "ws:api_error_ratio:rate6h"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[6h])) / sum(rate(http_server_request_duration_seconds_count[6h]))"
      - record: "ws:api_error_ratio:rate1d"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[1d])) / sum(rate(http_server_request_duration_seconds_count[1d]))"
      - record: "ws:api_error_ratio:rate3d"
        expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\", ws_unavailable_reason!=\"kill_switch\"}[3d])) / sum(rate(http_server_request_duration_seconds_count[3d]))"
      - record: "ws:api_read_latency_seconds:p95_5m"
        expr: "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method=~\"GET|HEAD\"}[5m])))"
      - record: "ws:api_write_latency_seconds:p95_5m"
        expr: "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_request_method=~\"POST|PUT|PATCH|DELETE\"}[5m])))"
      - record: "ws:api_read_requests:increase5m"
        expr: "sum(increase(http_server_request_duration_seconds_count{http_request_method=~\"GET|HEAD\"}[5m]))"
      - record: "ws:api_write_requests:increase5m"
        expr: "sum(increase(http_server_request_duration_seconds_count{http_request_method=~\"POST|PUT|PATCH|DELETE\"}[5m]))"
      - record: "ws:api_module_unavailable:rate5m"
        expr: "sum(rate(http_server_request_duration_seconds_count{ws_unavailable_reason=\"kill_switch\"}[5m]))"
      - record: "ws:bank_sync_failure_ratio:1h"
        expr: "sum(increase(ws_bank_sync_runs_total{ws_outcome=\"failure\"}[1h])) / sum(increase(ws_bank_sync_runs_total[1h]))"
  - name: "willowsum-slo-alerts"
    interval: "1m"
    rules:
      - alert: "ApiErrorBudgetBurnFast"
        expr: "ws:api_error_ratio:rate1h > (14.4 * 0.001) and ws:api_error_ratio:rate5m > (14.4 * 0.001)"
        for: "2m"
        labels:
          severity: "page"
          slo: "api-availability"
          service: "willowsum-api"
        annotations:
          summary: "API is burning the 30-day error budget 14.4× too fast (2 % of the budget in 1 hour)"
          requirement: "ARC-09 FR 4: error budget violation"
          runbook: "infra/observability/README.md#apierrorbudgetburnfast"
      - alert: "ApiErrorBudgetBurnMedium"
        expr: "ws:api_error_ratio:rate6h > (6 * 0.001) and ws:api_error_ratio:rate30m > (6 * 0.001)"
        for: "2m"
        labels:
          severity: "page"
          slo: "api-availability"
          service: "willowsum-api"
        annotations:
          summary: "API is burning the 30-day error budget 6× too fast (5 % of the budget in 6 hours)"
          requirement: "ARC-09 FR 4: error budget violation"
          runbook: "infra/observability/README.md#apierrorbudgetburnmedium"
      - alert: "ApiErrorBudgetBurnSlow"
        expr: "ws:api_error_ratio:rate3d > (1 * 0.001) and ws:api_error_ratio:rate6h > (1 * 0.001)"
        for: "15m"
        labels:
          severity: "ticket"
          slo: "api-availability"
          service: "willowsum-api"
        annotations:
          summary: "API has used the error budget at the SLO rate for 3 days (10 % of the budget)"
          requirement: "ARC-09 FR 4: error budget violation"
          runbook: "infra/observability/README.md#apierrorbudgetburnslow"
      - alert: "Api5xxRatioHigh"
        expr: "ws:api_error_ratio:rate5m > 0.01 and ws:api_requests:rate5m > 0"
        for: "2m"
        labels:
          severity: "page"
          slo: "api-5xx-ratio"
          service: "willowsum-api"
        annotations:
          summary: "More than 1 % of API requests answered with a 5xx over 5 minutes"
          requirement: "NFR-10 FR 6: 5xx ratio above 1 %"
          runbook: "infra/observability/README.md#api5xxratiohigh"
      - alert: "ApiReadLatencyP95High"
        expr: "ws:api_read_latency_seconds:p95_5m > 0.3 and ws:api_read_requests:increase5m >= 20"
        for: "2m"
        labels:
          severity: "page"
          slo: "api-read-latency"
          service: "willowsum-api"
        annotations:
          summary: "API read p95 above 300 ms over 5 minutes"
          requirement: "NFR-10 FR 6: SLO violation (read p95 ≤ 300 ms)"
          runbook: "infra/observability/README.md#apireadlatencyp95high"
      - alert: "ApiWriteLatencyP95High"
        expr: "ws:api_write_latency_seconds:p95_5m > 0.5 and ws:api_write_requests:increase5m >= 20"
        for: "2m"
        labels:
          severity: "page"
          slo: "api-write-latency"
          service: "willowsum-api"
        annotations:
          summary: "API write p95 above 500 ms over 5 minutes"
          requirement: "NFR-10 FR 6: SLO violation (write p95 ≤ 500 ms)"
          runbook: "infra/observability/README.md#apiwritelatencyp95high"
      - alert: "ApiModuleSwitchedOff"
        expr: "ws:api_module_unavailable:rate5m > 0"
        for: "30m"
        labels:
          severity: "ticket"
          slo: "api-availability"
          service: "willowsum-api"
        annotations:
          summary: "A module's kill switch has turned requests away for more than 30 minutes"
          requirement: "CICD-06: a module kill switch left on (not an outage, not paged)"
          runbook: "infra/observability/README.md#apimoduleswitchedoff"
      - alert: "BankSyncFailureRatioHigh"
        expr: "ws:bank_sync_failure_ratio:1h > 0.05"
        for: "1m"
        labels:
          severity: "page"
          slo: "bank-sync-failure-ratio"
          service: "willowsum-api"
        annotations:
          summary: "More than 5 % of bank synchronisation runs failed in the last hour"
          requirement: "NFR-10 FR 6: bank sync failures above 5 % in an hour"
          runbook: "infra/observability/README.md#banksyncfailureratiohigh"
