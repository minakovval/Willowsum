<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Меню профілю і перемикач простору</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #1B2230;">
  <div style="position: absolute; inset: 0;"><dc-import name="Shell" active="home" height="800" hint-size="1280px,800px"></dc-import></div>
  <div role="menu" aria-label="Профіль" style="position: absolute; bottom: 16px; left: 220px; width: 300px; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 8px; box-shadow: 0 1px 2px rgba(11,37,69,.10), 0 8px 24px rgba(11,37,69,.12); padding: 6px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px;">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #1D4E89; color: #FFFFFF; display: grid; place-items: center; font-weight: 600;">ОК</span>
      <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Олена Коваленко</span><span style="color: #566174; font-size: 13px;">olena@example.com</span></span>
    </div>
    <div role="separator" style="height: 1px; background: #E5E5E2; margin: 6px 4px;"></div>
    <span style="display: block; padding: 6px 10px; font: 500 12px/16px Inter, sans-serif; letter-spacing: 0.08em; color: #566174;">ПРОСТОРИ</span>
    <button type="button" role="menuitemradio" aria-checked="true" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border: 0; border-radius: 4px; background: #F1F1EF; text-align: left; font: inherit; color: inherit;">
      <span style="width: 28px; height: 28px; border-radius: 4px; background: #0B2545; color: #F6F1E8; display: grid; place-items: center; font-weight: 600; font-size: 12px;">РК</span>
      <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">Родина Коваленків</span><span style="color: #566174; font-size: 12px;">Owner · 3 учасники</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
    </button>
    <button type="button" role="menuitemradio" aria-checked="false" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; font: inherit; color: inherit;">
      <span style="width: 28px; height: 28px; border-radius: 4px; background: #9DB2C8; color: #0B2545; display: grid; place-items: center; font-weight: 600; font-size: 12px;">ФО</span>
      <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">ФОП Коваленко</span><span style="color: #566174; font-size: 12px;">Owner · лише ви</span></span>
    </button>
    <button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; font: 500 14px Inter, sans-serif; color: #1D4E89;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Створити простір
    </button>
    <div role="separator" style="height: 1px; background: #E5E5E2; margin: 6px 4px;"></div>
    <sc-for list="{{items}}" as="m" hint-placeholder-count="4">
      <button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; font: 500 14px Inter, sans-serif; color: #1B2230;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566174" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{m.d1}}"></path><path d="{{m.d2}}"></path></svg><span style="display: flex; flex-direction: column; line-height: 18px;"><span>{{m.label}}</span><span style="color: #566174; font: 400 12px/16px Inter, sans-serif;">{{m.sub}}</span></span></button>
    </sc-for>
    <div role="separator" style="height: 1px; background: #E5E5E2; margin: 6px 4px;"></div>
    <button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; font: 500 14px Inter, sans-serif; color: #1B2230;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566174" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path></svg>Вийти</button>
  </div>
</div>
</x-dc>

      { label: 'Довідка і підтримка', sub: '',  d1: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z', d2: 'M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01' }
    ] }; }
}
</script>
</body>
</html>
