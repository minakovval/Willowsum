<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Меню «Додати»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #1B2230;">
  <div style="position: absolute; inset: 0;"><dc-import name="PocShell" active="home" height="800" hint-size="1280px,800px"></dc-import></div>
  <div role="menu" aria-label="Додати" style="position: absolute; top: 56px; left: 220px; width: 300px; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 8px; box-shadow: 0 1px 2px rgba(11,37,69,.10), 0 8px 24px rgba(11,37,69,.12); padding: 6px;">
    <sc-for list="{{items}}" as="m" hint-placeholder-count="8">
      <sc-if value="{{m.sep}}" hint-placeholder-val="{{false}}"><div role="separator" style="height: 1px; background: #E5E5E2; margin: 6px 4px;"></div></sc-if>
      <sc-if value="{{m.item}}" hint-placeholder-val="{{true}}">
        <button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px 0 {{m.pad}}; border: 0; border-radius: 4px; background: {{m.bg}}; color: #1B2230; font: 500 14px Inter, sans-serif; text-align: left;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566174" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d1}}"></path><path d="{{m.d2}}"></path></svg>
          <span style="flex: 1;">{{m.label}}</span>
          <span style="color: #566174; font: 400 12px Inter, sans-serif;">{{m.key}}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const I = (label, d1, d2, extra) => Object.assign({ item: true, sep: false, label, d1, d2, key: '', pad: '10px', bg: 'transparent' }, extra || {});
    return { items: [
      I('Транзакція', 'm16 3 4 4-4 4', 'M20 7H4m4 14-4-4 4-4m-4 4h16', { key: 'T', bg: '#F1F1EF' }),
      I('Імпортувати виписку', 'M12 3v12', 'm7 10 5 5 5-5M5 21h14', { pad: '24px' }),
      { sep: true, item: false },
      I('Рахунок', 'M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7', 'm12 2 8 5H4z'),
      I('Ціль', 'M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528', '')
    ] };
  }
}
</script>
</body>
</html>
