<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Повторне підтвердження особи</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@600&amp;display=swap">
<style>body{margin:0}a{color:#1D4E89}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #1B2230;">
  <div style="position: absolute; inset: 0;"><dc-import name="Shell" active="more" page="Сейф" height="800" hint-size="1280px,800px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: rgba(11, 37, 69, 0.36); backdrop-filter: blur(2px);"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="su" aria-describedby="sud" style="position: absolute; left: 432px; top: 150px; width: 416px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; box-shadow: 0 2px 4px rgba(11,37,69,.06), 0 24px 48px rgba(11,37,69,.20); overflow: hidden;">
    <button type="button" aria-label="Закрити" style="position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: #566174;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <div style="padding: 32px 32px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #EEF2F7; display: grid; place-items: center; color: #0B2545;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
      <h2 id="su" style="margin: 4px 0 0; font: 600 22px/28px 'Inter Tight', Inter, sans-serif; letter-spacing: -0.015em;">Підтвердіть, що це ви</h2>
      <p id="sud" style="margin: 0; color: #566174; font-size: 15px; line-height: 22px; max-width: 300px;">Щоб відкрити Сейф, введіть код із застосунку-автентифікатора.</p>
      <div role="group" aria-label="Код із 6 цифр" style="display: flex; gap: 8px; margin-top: 12px;">
        <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
          <sc-if value="{{d.focus}}" hint-placeholder-val="{{false}}"><span style="width: 44px; height: 52px; box-sizing: border-box; border: 2px solid #1D4E89; border-radius: 10px; display: grid; place-items: center; font: 600 22px Inter, sans-serif; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 4px rgba(29,78,137,.12);">{{d.v}}</span></sc-if>
          <sc-if value="{{d.rest}}" hint-placeholder-val="{{true}}"><span style="width: 44px; height: 52px; box-sizing: border-box; border: 1px solid {{d.border}}; border-radius: 10px; background: {{d.bg}}; display: grid; place-items: center; font: 600 22px Inter, sans-serif; font-variant-numeric: tabular-nums;">{{d.v}}</span></sc-if>
        </sc-for>
      </div>
      <span style="color: #566174; font-size: 13px;">Підтвердження діє 5 хвилин</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 20px 32px 28px; background: #FAFAF8; border-top: 1px solid #F1F1EF;"><button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #7B8494; border-radius: 8px; background: #FFFFFF; color: #1B2230; font: 600 14px Inter, sans-serif; white-space: nowrap;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -4px; margin-right: 6px;"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Ключ доступу</button><button type="button" style="height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: #0B2545; color: #F6F1E8; font: 600 14px Inter, sans-serif; white-space: nowrap;">Підтвердити</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const vals = ['4', '8', '2', '9', '', ''];
    return { digits: vals.map((v, i) => ({ v, focus: i === 4, rest: i !== 4, border: v ? '#C9CDD3' : '#E5E5E2', bg: v ? '#FFFFFF' : '#FAFAF8' })) };
  }
}
</script>
</body>
</html>
