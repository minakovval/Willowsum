<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@600&amp;display=swap">
<style>
body{margin:0}
.ws-w{position:absolute;box-sizing:border-box;background:#FFFFFF;border:1.5px dashed #9DB2C8;border-radius:8px;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px;transition:none}
.ws-h{display:flex;align-items:center;gap:6px}
.ws-t{flex:1;font:500 13px/16px Inter,sans-serif;letter-spacing:.08em;color:#566174;white-space:nowrap}
.ws-g{width:28px;height:28px;margin:-4px 0 -4px -6px;display:grid;place-items:center;border:0;border-radius:6px;background:#F1F1EF;color:#566174;cursor:grab}
.ws-x{width:28px;height:28px;margin:-4px -6px -4px 0;display:grid;place-items:center;border:0;border-radius:999px;background:#F1F1EF;color:#566174}
.ws-b{flex:1;display:flex;flex-direction:column;gap:10px;opacity:.6;pointer-events:none}
.ws-l{height:10px;border-radius:4px;background:#EEF1F4}
.ws-big{font:600 22px/28px 'Inter Tight',Inter,sans-serif;color:#1B2230;font-variant-numeric:tabular-nums}
/* 18 s loop, one widget dragged at a time («Цілі»), the rest reflow out of its way:
   A) across the row to slot 3; B) down to the next row (straight down, then left once «Транзакції» has moved up); C) back up to slot 1 */
@keyframes ws-drag{0%,2%{transform:translate(0,0) scale(1) rotate(0);box-shadow:none;border-style:dashed;opacity:1} 5%{transform:translate(0,-14px) scale(1.03) rotate(-1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 21%{transform:translate(685px,-14px) scale(1.03) rotate(1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 24%,34%{transform:translate(685px,0) scale(1) rotate(0);box-shadow:none;border-style:dashed;opacity:1} 37%{transform:translate(685px,-14px) scale(1.03) rotate(-1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 45%{transform:translate(685px,230px) scale(1.03) rotate(0.6deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 51%{transform:translate(685px,230px) scale(1.03) rotate(0.6deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 56%{transform:translate(0,230px) scale(1.03) rotate(-1deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 58%,66%{transform:translate(0,244px) scale(1) rotate(0);box-shadow:none;border-style:dashed;opacity:1} 69%{transform:translate(0,230px) scale(1.03) rotate(-1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 85%{transform:translate(0,-14px) scale(1.03) rotate(1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid;opacity:.92} 88%,100%{transform:translate(0,0) scale(1) rotate(0);box-shadow:none;border-style:dashed;opacity:1}}
@keyframes ws-s1{0%,8%{transform:translate(0,0)}13%,72%{transform:translate(-342.67px,0)}78%,100%{transform:translate(0,0)}}
@keyframes ws-s2{0%,13%{transform:translate(0,0)}18%,74%{transform:translate(-342.67px,0)}80%,100%{transform:translate(0,0)}}
@keyframes ws-up{0%,44%{transform:translate(0,0)}51%,80%{transform:translate(685.33px,-244px)}88%,100%{transform:translate(0,0)}}
@keyframes ws-ph{0%,3%{opacity:0;transform:translate(0,0)}6%{opacity:1;transform:translate(0,0)}12%{opacity:1;transform:translate(342.67px,0)}18%,21%{opacity:1;transform:translate(685.33px,0)}24%,35%{opacity:0;transform:translate(685.33px,0)}38%,44%{opacity:1;transform:translate(685.33px,0)}48%,56%{opacity:1;transform:translate(0,244px)}58%,67%{opacity:0;transform:translate(0,244px)}70%,72%{opacity:1;transform:translate(0,244px)}77%,85%{opacity:1;transform:translate(0,0)}88%,100%{opacity:0;transform:translate(0,0)}}
@keyframes ws-cur{0%,2%{transform:translate(0,0)}5%{transform:translate(0,-14px)}21%{transform:translate(685px,-14px)}24%,34%{transform:translate(685px,0)}37%{transform:translate(685px,-14px)}45%,51%{transform:translate(685px,230px)}56%{transform:translate(0,230px)}58%,66%{transform:translate(0,244px)}69%{transform:translate(0,230px)}85%{transform:translate(0,-14px)}88%,100%{transform:translate(0,0)}}
@keyframes ws-grab{0%,2%{opacity:0}4%,23%{opacity:1}26%,34%{opacity:0}36%,57%{opacity:1}60%,66%{opacity:0}68%,87%{opacity:1}90%,100%{opacity:0}}
.ws-drag{animation:ws-drag 18s cubic-bezier(.45,.05,.25,1) infinite;z-index:3}
.ws-s1{animation:ws-s1 18s cubic-bezier(.3,.7,.2,1) infinite;z-index:2}
.ws-s2{animation:ws-s2 18s cubic-bezier(.3,.7,.2,1) infinite;z-index:2}
.ws-up{animation:ws-up 18s cubic-bezier(.3,.7,.2,1) infinite;z-index:2}
.ws-ph{animation:ws-ph 18s cubic-bezier(.3,.7,.2,1) infinite}
.ws-cur{animation:ws-cur 18s cubic-bezier(.45,.05,.25,1) infinite}
.ws-grab{animation:ws-grab 18s linear infinite}
@media (prefers-reduced-motion: reduce){.ws-drag,.ws-up,.ws-s1,.ws-s2,.ws-ph,.ws-cur,.ws-grab{animation-play-state:paused;animation-delay:-2.2s}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 1060px; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #1B2230;">
  <div style="position: absolute; inset: 0;"><dc-import name="Shell" active="home" height="1060" hint-size="1280px,1060px"></dc-import></div>
  <main style="position: absolute; left: 212px; top: 64px; width: 1068px; height: 996px; box-sizing: border-box; padding: 24px 32px 32px; background: #F4F5F6;">

    <div role="toolbar" aria-label="Редагування «Огляду»" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 16px; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 10px; box-shadow: 0 1px 2px rgba(11,37,69,.06);">
      <span style="width: 32px; height: 32px; border-radius: 8px; background: #EEF2F7; color: #0B2545; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span>
      <span style="display: flex; flex-direction: column;"><b style="font-weight: 600;">Редагування «Огляду»</b><span style="color: #566174; font-size: 13px; line-height: 16px;">Перетягніть віджет за <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align: -1px;"><circle cx="9" cy="6" r="1.8"></circle><circle cx="15" cy="6" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="18" r="1.8"></circle><circle cx="15" cy="18" r="1.8"></circle></svg>, щоб змінити порядок</span></span>

      <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #7B8494; border-radius: 8px; background: #FFFFFF; color: #1B2230; font: 600 14px Inter, sans-serif;">Скасувати</button>
      <button type="button" style="height: 40px; padding: 0 20px; border: 0; border-radius: 8px; background: #0B2545; color: #F6F1E8; font: 600 14px Inter, sans-serif;">Готово</button>
    </div>

    <div style="position: relative; margin-top: 24px; height: 860px;">
      <!-- attention strip widget -->
      <section class="ws-w" style="left: 0; top: 0; width: 1004px; height: 52px; padding: 0 16px; flex-direction: row; align-items: center;">
        <button type="button" class="ws-g" aria-label="Перемістити «Потребує уваги»"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"></circle><circle cx="15" cy="6" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="18" r="1.8"></circle><circle cx="15" cy="18" r="1.8"></circle></svg></button>
        <span class="ws-t" style="flex: none;">ПОТРЕБУЄ УВАГИ · 3</span>
        <span style="flex: 1; display: flex; gap: 8px; opacity: .6;"><span class="ws-l" style="width: 180px; height: 22px; border-radius: 999px;"></span><span class="ws-l" style="width: 160px; height: 22px; border-radius: 999px;"></span><span class="ws-l" style="width: 140px; height: 22px; border-radius: 999px;"></span></span>
        <button type="button" class="ws-x" aria-label="Прибрати «Потребує уваги»"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </section>

      <sc-for list="{{top}}" as="w" hint-placeholder-count="2">
        <section class="ws-w" style="left: {{w.x}}px; top: 76px; width: {{w.wd}}px; height: 300px;">
          <div class="ws-h"><button type="button" class="ws-g" aria-label="Перемістити «{{w.name}}»"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"></circle><circle cx="15" cy="6" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="18" r="1.8"></circle><circle cx="15" cy="18" r="1.8"></circle></svg></button><span class="ws-t">{{w.title}}</span><button type="button" class="ws-x" aria-label="Прибрати «{{w.name}}»"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
          <div class="ws-b"><span class="ws-big">{{w.big}}</span><svg width="100%" height="150" viewBox="0 0 300 150" preserveAspectRatio="none" aria-hidden="true"><path d="{{w.path}}" fill="none" stroke="#9DB2C8" stroke-width="2" vector-effect="non-scaling-stroke"></path></svg><span class="ws-l" style="width: 60%;"></span></div>
        </section>
      </sc-for>

      <!-- drop placeholder slot -->
      <div class="ws-ph" aria-hidden="true" style="position: absolute; left: 0; top: 400px; width: 318.67px; height: 220px; box-sizing: border-box; border: 2px dashed #1D4E89; border-radius: 8px; background: rgba(29,78,137,.06); opacity: 0;"></div>

      <sc-for list="{{row}}" as="w" hint-placeholder-count="3">
        <section class="ws-w {{w.cls}}" style="left: {{w.x}}px; top: 400px; width: 318.67px; height: 220px;">
          <div class="ws-h"><button type="button" class="ws-g" aria-label="Перемістити «{{w.name}}»"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"></circle><circle cx="15" cy="6" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="18" r="1.8"></circle><circle cx="15" cy="18" r="1.8"></circle></svg></button><span class="ws-t">{{w.title}}</span><button type="button" class="ws-x" aria-label="Прибрати «{{w.name}}»"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
          <div class="ws-b"><span class="ws-big">{{w.big}}</span><span class="ws-l" style="width: {{w.b1}}%;"></span><span class="ws-l" style="width: {{w.b2}}%;"></span><span class="ws-l" style="width: {{w.b3}}%;"></span></div>
        </section>
      </sc-for>

      <!-- grab cursor riding on the dragged widget handle -->
      <div class="ws-cur" aria-hidden="true" style="position: absolute; left: 14px; top: 420px; z-index: 4; pointer-events: none;"><div class="ws-grab" style="opacity: 0;"><svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#1B2230" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11.5V9a2 2 0 0 0-4 0v1.4"></path><path d="M14 10V8a2 2 0 0 0-4 0v2"></path><path d="M10 9.9V9a2 2 0 0 0-4 0v5"></path><path d="M6 14a2 2 0 0 0-2 2v0a8 8 0 0 0 8 6h0a6 6 0 0 0 6-6v-4.5a2 2 0 1 1 4 0V15"></path></svg></div></div>

      <section class="ws-w ws-up" style="left: 0; top: 644px; width: 318.67px; height: 220px;">
        <div class="ws-h"><button type="button" class="ws-g" aria-label="Перемістити «Останні транзакції»"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"></circle><circle cx="15" cy="6" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="18" r="1.8"></circle><circle cx="15" cy="18" r="1.8"></circle></svg></button><span class="ws-t">ТРАНЗАКЦІЇ</span><button type="button" class="ws-x" aria-label="Прибрати «Останні транзакції»"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
        <div class="ws-b"><span class="ws-l" style="width: 90%;"></span><span class="ws-l" style="width: 75%;"></span><span class="ws-l" style="width: 85%;"></span><span class="ws-l" style="width: 70%;"></span><span class="ws-l" style="width: 80%;"></span></div>
      </section>

      <button type="button" style="position: absolute; left: 342.67px; top: 644px; width: 318.67px; height: 216px; box-sizing: border-box; border: 1.5px dashed #C9CDD3; border-radius: 8px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #1D4E89; font: 600 14px Inter, sans-serif;">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #EEF2F7; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span>

        <span style="color: #566174; font: 400 13px Inter, sans-serif;">Ще 7 доступно</span>
      </button>
    </div>
  </main>
</div>
