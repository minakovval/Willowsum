@keyframes ws-drag{

 13%{transform:translate(0,-6px) scale(1.04) rotate(-1.5deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid}

 44%,58%{transform:translate(685px,0) scale(1) rotate(0);box-shadow:none;border-style:dashed}
 63%{transform:translate(685px,-6px) scale(1.04) rotate(1.5deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid}
 88%{transform:translate(0,-6px) scale(1.04) rotate(-1.2deg);box-shadow:0 24px 48px rgba(11,37,69,.22),0 2px 6px rgba(11,37,69,.10);border-style:solid}
 94%,100%{transform:translate(0,0) scale(1) rotate(0);box-shadow:none;border-style:dashed}}
@keyframes ws-s1{0%,20%{transform:translateX(0)}28%,72%{transform:translateX(-342.67px)}80%,100%{transform:translateX(0)}}
@keyframes ws-s2{0%,28%{transform:translateX(0)}36%,64%{transform:translateX(-342.67px)}72%,100%{transform:translateX(0)}}

@keyframes ws-cur{0%,8%{transform:translate(0,0)}13%{transform:translate(0,-6px)}38%{transform:translate(685px,-6px)}44%,58%{transform:translate(685px,0)}63%{transform:translate(685px,-6px)}88%{transform:translate(0,-6px)}94%,100%{transform:translate(0,0)}}
@keyframes ws-grab{0%,8%{opacity:0}11%,42%{opacity:1}46%,59%{opacity:0}61%,92%{opacity:1}96%,100%{opacity:0}}
.ws-drag{animation:ws-drag 9s cubic-bezier(.45,.05,.25,1) infinite;z-index:3}
.ws-s1{animation:ws-s1 9s cubic-bezier(.3,.7,.2,1) infinite}
.ws-s2{animation:ws-s2 9s cubic-bezier(.3,.7,.2,1) infinite}
.ws-ph{animation:ws-ph 9s cubic-bezier(.3,.7,.2,1) infinite}
.ws-cur{animation:ws-cur 9s cubic-bezier(.45,.05,.25,1) infinite}
.ws-grab{animation:ws-grab 9s linear infinite}
@media (prefers-reduced-motion: reduce){.ws-drag,.ws-s1,.ws-s2,.ws-ph,.ws-cur,.ws-grab{animation-play-state:paused;animation-delay:-2.9s}}
