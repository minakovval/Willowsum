<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Willowsum</title>
    <!--
      DS-11 item 7: apply a stored manual theme before the first paint (no flash of the light theme).
      A classic blocking script from the app's own origin, not inline: the CSP allows scripts from 'self'
      only (NFR-14 FR 3). The key and values must match THEME_STORAGE_KEY / THEME_ATTRIBUTE in @willowsum/ui (tested).
    -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
